<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Chi tiết thông tin sách</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width: 700px;">
    <div class="card shadow border-0 bg-white rounded-3 p-4" th:if="${book != null}">
        <h3 class="text-info fw-bold mb-4">Thông tin chi tiết cuốn sách</h3>
        <div class="table-responsive">
            <table class="table table-bordered">
                <tr>
                    <th class="bg-light w-30">Mã ID sách</th>
                    <td class="fw-bold" th:text="${book.id}">101</td>
                </tr>
                <tr>
                    <th class="bg-light">Tiêu đề sách</th>
                    <td th:text="${book.title}">Tiêu đề mẫu</td>
                </tr>
                <tr>
                    <th class="bg-light">Tác giả</th>
                    <td th:text="${book.author}">Tác giả mẫu</td>
                </tr>
                <tr>
                    <th class="bg-light">Điểm số đánh giá</th>
                    <td><span class="badge bg-warning text-dark fw-bold" th:text="${book.point}">5</span> / 5 Sao</td>
                </tr>
                <tr>
                    <th class="bg-light">Bình luận / Ghi chú</th>
                    <td style="white-space: pre-line;" th:text="${book.bookcomment}">Nội dung lời bình...</td>
                </tr>
                <tr>
                    <th class="bg-light">Cập nhật cuối lúc</th>
                    <td th:text="${#temporals.format(book.lastupdate, 'dd/MM/yyyy HH:mm:ss')}">Ngày giờ cập nhật</td>
                </tr>
            </table>
        </div>
        <div class="d-flex gap-2 mt-3">
            <a th:href="@{/books/edit/{id}(id=${book.id})}" class="btn btn-primary px-4">Edit</a>
            <a th:href="@{/books}" class="btn btn-secondary px-4">Back</a>
        </div>
    </div>
    <!-- Trường hợp không tìm thấy sách lỗi ID đường dẫn -->
    <div class="alert alert-danger shadow border-0" th:unless="${book != null}">
        Không tìm thấy dữ liệu của cuốn sách yêu cầu. <a th:href="@{/books}" class="alert-link">Quay lại trang chủ</a>.
    </div>
</div>
</body>
</html>
