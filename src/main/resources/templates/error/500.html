<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Sự cố hệ thống</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center" style="min-height: 90vh;">
<div class="container text-center" style="max-width: 600px;">
    <div class="card shadow border-0 p-5 bg-white rounded-3">
        <h1 class="display-1 text-warning fw-bold">500</h1>
        <h3 class="fw-bold text-dark mb-3">Đã xảy ra sự cố kỹ thuật</h3>
        <p class="text-muted mb-4">Hệ thống ghi nhận một lỗi không mong muốn từ máy chủ ứng dụng.</p>
        
        <!-- Khối hiển thị chi tiết lỗi kỹ thuật -->
        <div class="alert alert-secondary text-start small mb-4" th:if="${systemError}">
            <code th:text="${systemError}">Mô tả mã lỗi...</code>
        </div>
        
        <a th:href="@{/books}" class="btn btn-primary py-2 px-4">Quay lại trang chủ an toàn</a>
    </div>
</div>
</body>
</html>
