<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Chỉnh sửa thông tin sách</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width: 600px;">
    <div class="card shadow border-0 bg-white rounded-3 p-4">
        <h3 class="text-primary fw-bold mb-4">Cập nhật thông tin sách</h3>
        
        <form th:action="@{/books/edit}" th:object="${book}" method="post">
            <div class="mb-3">
                <label class="form-label fw-semibold text-muted">Mã ID sách (Không được thay đổi):</label>
                <!-- Thêm thuộc tính readonly để ngăn người dùng sửa đổi ID khóa chính -->
                <input type="number" th:field="*{id}" class="form-control bg-light" readonly>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Tiêu đề sách:</label>
                <input type="text" th:field="*{title}" class="form-control" required maxlength="100">
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Tác giả:</label>
                <input type="text" th:field="*{author}" class="form-control" required maxlength="50">
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Điểm đánh giá (1-5 sao):</label>
                <input type="number" th:field="*{point}" class="form-control" min="1" max="5">
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold">Lời bình luận / Ghi chú:</label>
                <textarea th:field="*{bookcomment}" class="form-control" rows="4"></textarea>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Save</button>
                <a th:href="@{/books}" class="btn btn-outline-secondary w-50 py-2">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
