<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Thêm sách mới</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width: 600px;">
    <div class="card shadow border-0 bg-white rounded-3 p-4">
        <h3 class="text-success fw-bold mb-4">Đăng ký sách mới</h3>
        <!-- Chèn đoạn code này vào bên trong thẻ <div class="card shadow"> và TRÊN thẻ <form> -->
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
            <svg xmlns="http://w3.org" width="18" height="18" fill="currentColor" class="bi bi-exclamation-triangle-fill me-2" viewBox="0 0 16 16">
                <path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5m.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2"/>
            </svg>
            <span th:text="${errorMessage}">Thông báo lỗi mẫu hiện ở đây</span>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" onclick="this.parentElement.remove()"></button>
        </div>

        <!-- th:object="${book}": Khớp nối đối tượng Book rỗng truyền từ Controller -->
        <form th:action="@{/books/add}" th:object="${book}" method="post" class="needs-validation">
            <div class="mb-3">
                <label class="form-label fw-semibold">Mã ID sách (Yêu cầu nhập số):</label>
                <!-- th:field="*{id}": Tự động map giá trị vào biến id của Object Book -->
                <input type="number" th:field="*{id}" class="form-control" placeholder="Ví dụ: 101" required min="1">
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Tiêu đề sách:</label>
                <input type="text" th:field="*{title}" class="form-control" placeholder="Nhập tên sách" required maxlength="100">
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Tác giả:</label>
                <input type="text" th:field="*{author}" class="form-control" placeholder="Nhập tên tác giả" required maxlength="50">
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Điểm đánh giá (1-5 sao):</label>
                <input type="number" th:field="*{point}" class="form-control" min="1" max="5" placeholder="Nhập số từ 1 đến 5">
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold">Lời bình luận / Ghi chú:</label>
                <textarea th:field="*{bookcomment}" class="form-control" rows="4" placeholder="Nhập nhận xét về cuốn sách..."></textarea>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-success w-100 py-2 fw-bold">Save</button>
                <a th:href="@{/books}" class="btn btn-outline-secondary w-50 py-2">Back</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
