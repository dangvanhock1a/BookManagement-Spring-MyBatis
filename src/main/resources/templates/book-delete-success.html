<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Màn hình hoàn tất delete</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
</head>
<body class="container mt-5 text-center">
    <div class="card mx-auto border-danger" style="max-width: 500px;">
        <div class="card-body py-5">
            <div class="text-danger mb-3">
                <!-- Biểu tượng thùng rác Bootstrap Icon -->
                <svg xmlns="http://w3.org" width="64" height="64" fill="currentColor" class="bi bi-trash3-fill" viewBox="0 0 16 16">
                    <path d="M11 1.5v1h3.5a.5.5 0 0 1 0 1h-.538l-.853 10.66A2 2 0 0 1 11.115 16h-6.23a2 2 0 0 1-1.994-1.84L2.038 3.5H1.5a.5.5 0 0 1 0-1H5v-1A1.5 1.5 0 0 1 6.5 0h3A1.5 1.5 0 0 1 11 1.5Zm-5 0v1h4v-1a.5.5 0 0 0-.5-.5h-3a.5.5 0 0 0-.5,.5ZM4.5 5.029l.5 8.5a.5.5 0 1 0 .998-.06l-.5-8.5a.5.5 0 1 0-.998.06Zm6.53-.528a.5.5 0 0 0-.528.47l-.5 8.5a.5.5 0 0 0 .998.058l.5-8.5a.5.5 0 0 0-.47-.528ZM8 4.5a.5.5 0 0 0-.5.5v8.5a.5.5 0 0 0 1 0V5a.5.5 0 0 0-.5-.5Z"/>
                </svg>
            </div>
            <h3 class="card-title text-dark">Hoàn tất hoàn tất delete!</h3>
            <p class="card-text fs-5 mt-3">
                Thông tin Book có <strong class="text-danger">ID: <span th:text="${deletedId}"></span></strong> đã được xóa vĩnh viễn khỏi hệ thống.
            </p>
            <!-- Mũi tên điều hướng quay ngược lại Màn hình hiển thị danh sách gốc -->
            <a th:href="@{/books}" class="btn btn-outline-danger mt-4">Quay lại danh sách</a>
        </div>
    </div>
</body>
</html>
