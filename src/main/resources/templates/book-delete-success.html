<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Xóa sách thành công</title>

</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 80vh;">
<div class="container" style="max-width: 500px;">
    <div class="card shadow-sm border-0 bg-white rounded-3 p-5 text-center">
        <!-- Biểu tượng dấu tích Bootstrap Icon hoặc hình tròn trực quan -->
        <div class="mb-4 d-inline-block p-3 rounded-circle bg-danger bg-opacity-10 text-danger">
            <svg xmlns="http://w3.org" width="50" height="50" fill="currentColor" class="bi bi-trash3-fill" viewBox="0 0 16 16">
                <path d="M11 1.5v1h3.5a.5.5 0 0 1 0 1h-.538l-.853 10.66A2 2 0 0 1 11.115 16h-6.23a2 2 0 0 1-1.994-1.84L2.038 3.5H1.5a.5.5 0 0 1 0-1H5v-1A1.5 1.5 0 0 1 6.5 0h3A1.5 1.5 0 0 1 11 1.5m-5 0v1h4v-1a.5.5 0 0 0-.5-.5h-3a.5.5 0 0 0-.5.5M4.5 5.029l.5 8.5a.5.5 0 1 0 .998-.06l-.5-8.5a.5.5 0 1 0-.998.06m6.53-.528a.5.5 0 0 0-.528.47l-.5 8.5a.5.5 0 0 0 .998.058l.5-8.5a.5.5 0 0 0-.47-.528M8 4.5a.5.5 0 0 0-.5.5v8.5a.5.5 0 0 0 1 0V5a.5.5 0 0 0-.5-.5"/>
            </svg>
        </div>
        <h3 class="text-danger fw-bold mb-2">Thao tác thành công!</h3>
        <p class="text-muted mb-4">Bản ghi cuốn sách đã được xóa hoàn toàn ra khỏi hệ thống cơ sở dữ liệu.</p>
        <a th:href="@{/books}" class="btn btn-secondary w-100 py-2">Quay lại danh sách chính</a>
    </div>
</div>
</body>
</html>
