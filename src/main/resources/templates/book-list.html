<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Màn hình hiển thị danh sách sách</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
</head>
<body class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Màn hình hiển thị danh sách sách</h2>
        <!-- Nút thêm mới truyền kèm trạng thái danh sách hiện tại để phục vụ nút Back -->
        <a th:href="@{/books/add(page=${currentPage}, sortBy=${sortBy}, order=${order})}" class="btn btn-primary">Tạo mới thông tin book</a>
    </div>

    <!-- Bảng danh sách sách (Ẩn cột bình luận COMMENT) -->
    <table class="table table-striped table-bordered text-center align-middle">
        <thead class="table-dark">
            <tr>
                <th><a th:href="@{/books(page=${currentPage}, sortBy='ID', order=${order == 'ASC' ? 'DESC' : 'ASC'})}" class="text-white text-decoration-none">ID ↕</a></th>
                <th><a th:href="@{/books(page=${currentPage}, sortBy='TITLE', order=${order == 'ASC' ? 'DESC' : 'ASC'})}" class="text-white text-decoration-none">Title ↕</a></th>
                <th><a th:href="@{/books(page=${currentPage}, sortBy='AUTHOR', order=${order == 'ASC' ? 'DESC' : 'ASC'})}" class="text-white text-decoration-none">Tác giả ↕</a></th>
                <th><a th:href="@{/books(page=${currentPage}, sortBy='POINT', order=${order == 'ASC' ? 'DESC' : 'ASC'})}" class="text-white text-decoration-none">Point đánh giá ↕</a></th>
                <th><a th:href="@{/books(page=${currentPage}, sortBy='LASTUPDATE', order=${order == 'ASC' ? 'DESC' : 'ASC'})}" class="text-white text-decoration-none">Ngày giờ update ↕</a></th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="book : ${books}">
                <!-- Nhấn vào ID di chuyển sang màn hình Chi tiết kèm tham số trạng thái danh sách -->
                <td>
                    <a th:href="@{/books/detail/{id}(id=${book.id}, page=${currentPage}, sortBy=${sortBy}, order=${order})}" 
                       th:text="${book.id}" class="fw-bold text-decoration-none"></a>
                </td>
                <td th:text="${book.title}"></td>
                <td th:text="${book.author}"></td>
                <td th:text="${book.point}"></td>
                <td th:text="${#temporals.format(book.lastupdate, 'yyyy-MM-dd HH:mm:ss')}"></td>
            </tr>
        </tbody>
    </table>

    <!-- Thanh phân trang (Paging Component) -->
    <nav>
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                <a class="page-link" th:href="@{/books(page=${currentPage - 1}, sortBy=${sortBy}, order=${order})}">Previous</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(1, totalPages)}" th:classappend="${currentPage == i} ? 'active'">
                <a class="page-link" th:href="@{/books(page=${i}, sortBy=${sortBy}, order=${order})}" th:text="${i}"></a>
            </li>
            <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
                <a class="page-link" th:href="@{/books(page=${currentPage + 1}, sortBy=${sortBy}, order=${order})}">Next</a>
            </li>
        </ul>
    </nav>
</body>
</html>
