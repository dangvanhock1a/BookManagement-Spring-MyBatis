<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ví dụ về Spring boot + MyBatis + REST API</title>
    <!-- Nhúng Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h2 class="text-center mb-4 text-primary text-uppercase fw-bold">Quản lý thư viện sách (REST API + AJAX)</h2>

    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center py-3">
            <h5 class="mb-0 fw-bold"></h5>
            <!-- BUTTON THÊM MỚI SÁCH LÊN ĐẦU -->
            <button class="btn btn-light fw-bold text-primary shadow-sm" onclick="prepareAdd()">
                ➕ Thêm
            </button>
        </div>
        <div class="card-body p-0">
            <table class="table table-hover table-striped mb-0 text-center align-middle">
                <thead class="table-primary">
                    <tr>
                        <th style="width: 15%">Mã ID</th>
                        <th style="width: 40%">Tên Sách</th>
                        <th style="width: 25%">Tác Giả</th>
                        <th style="width: 20%">Hành Động</th>
                    </tr>
                </thead>
                <tbody id="bookTableBody">
                    <!-- Dữ liệu API tự động chèn vào đây -->
                </tbody>
            </table>
            <!-- Thanh phân trang (Pagination) nằm dưới chân bảng -->
            <div class="card-footer bg-white d-flex justify-content-between align-items-center py-3">
                <div class="text-muted small" id="paginationInfo">
                    Đang hiển thị...
                </div>
                <nav aria-label="Page navigation">
                    <ul class="pagination pagination-sm mb-0" id="paginationButtons">
                        <!-- Các nút Số trang 1, 2, 3... sẽ được JS tự động vẽ vào đây -->
                    </ul>
                </nav>
            </div>
        </div>
    </div>
</div>

<!-- ================= CỬA SỔ MODAL/POPUP NHẬP LIỆU ================= -->
<div class="modal fade" id="bookModal" data-bs-backdrop="static" tabindex="-1" aria-labelledby="formTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content shadow">
            <div class="modal-header bg-dark text-white">
                <h5 class="modal-title fw-bold" id="formTitle">Thêm mới thông tin sách</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close" onclick="resetForm()"></button>
            </div>
            <div class="modal-body">
                <form id="bookForm">
                    <div class="mb-3">
                        <label for="bookId" class="form-label fw-semibold">Mã Sách (ID)</label>
                        <input type="number" class="form-control" id="bookId" required placeholder="Nhập ID số nguyên">
                    </div>
                    <div class="mb-3">
                        <label for="bookTitle" class="form-label fw-semibold">Tên Sách</label>
                        <input type="text" class="form-control" id="bookTitle" required placeholder="Nhập tên cuốn sách">
                    </div>
                    <div class="mb-3">
                        <label for="bookAuthor" class="form-label fw-semibold">Tác Giả</label>
                        <input type="text" class="form-control" id="bookAuthor" required placeholder="Nhập tên tác giả">
                    </div>
                    <div class="mb-3">
                        <label for="point" class="form-label fw-semibold">Điểm đánh giá (1-5 sao)</label>
                        <input type="number" class="form-control" id="point" min="1" max="5" placeholder="Nhập điểm 1-5">
                    </div>
                    <div class="mb-3">
                        <label for="bookcomment" class="form-label fw-semibold">Lời bình luận / Ghi chú</label>
                        <textarea class="form-control" id="bookcomment" rows="3" placeholder="Nhập ghi chú sách"></textarea>
                    </div>
                    <div class="modal-footer px-0 pb-0 pt-3">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" onclick="resetForm()">Đóng</button>
                        <button type="submit" class="btn btn-success" id="btnSubmit">Lưu</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Nhúng Bootstrap 5 JavaScript (Bắt buộc phải có để đóng/mở Modal) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

<!-- ================= MÃ LỆNH JAVASCRIPT XỬ LÝ BIẾN ĐỘNG ================= -->
<script>
    const API_URL = '/api/books';
    let isEditMode = false;
    let myModal;

    // 🌟 KHỞI TẠO CÁC BIẾN QUẢN LÝ PHÂN TRANG GỐC TRÊN CLIENT
    let currentPage = 0;   // Trang hiện tại (Backend tính từ số 0)
    const pageSize = 10;    // Số dòng hiển thị trên mỗi trang (Cố định là 5 dòng)

    document.addEventListener("DOMContentLoaded", function() {
        myModal = new bootstrap.Modal(document.getElementById('bookModal'));
        loadBooks(currentPage); // Mặc định tải trang đầu tiên
    });

    // 1. [GET] Lấy danh sách sách có truyền tham số phân trang ?page=...&size=...
    function loadBooks(page) {
        currentPage = page;
        
        fetch(`${API_URL}?page=${page}&size=${pageSize}`)
            .then(response => {
            if (!response.ok) {
            throw new Error("HTTP " + response.status);
            }
            return response.json();
            })
            .then(pageData => {
                // 🌟 THÊM DÒNG NÀY ĐỂ KIỂM TRA TRÊN TRÌNH DUYỆT (Bấm F12 -> chọn tab Console)
                console.log("Dữ liệu API trả về thực tế:", pageData);

                // Gán dữ liệu tương ứng với class PageResult custom
                const books = pageData.content || []; 
                const totalPages = pageData.totalPages || 1;
                const totalElements = pageData.totalElements || 0;

                // --- 1. RENDER BẢNG DỮ LIỆU ---
                const tbody = document.getElementById("bookTableBody");
                tbody.innerHTML = "";

                if (books.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="4" class="text-muted p-4">Chưa có cuốn sách nào ở trang này.</td></tr>`;
                    return;
                }

                books.forEach(book => {
                    tbody.innerHTML += `
                        <tr>
                            <td class="fw-bold">${book.id}</td>
                            <td class="text-start ps-4">${book.title}</td>
                            <td>${book.author}</td>
                            <td>
                                <button class="btn btn-warning btn-sm me-1" onclick="prepareEdit(${book.id}, '${book.title.replace(/'/g, "\\'")}', '${book.author.replace(/'/g, "\\'")}', ${book.point}, '${(book.bookcomment || '').replace(/'/g, "\\'")}')">Sửa</button>
                                <button class="btn btn-danger btn-sm" onclick="deleteBook(${book.id})">Xóa</button>
                            </td>
                        </tr>
                    `;
                });

                // --- 2. RENDER THÔNG TIN SỐ TRANG ---
                document.getElementById("paginationInfo").innerText = 
                    `Hiển thị trang ${currentPage + 1} / ${totalPages} (Tổng số ${totalElements} cuốn sách)`;

                // --- 3. RENDER CÁC NÚT ĐIỀU HƯỚNG PHÂN TRANG ---
                const paginationUl = document.getElementById("paginationButtons");
                paginationUl.innerHTML = "";

                // Nút "Trước" (Previous)
                paginationUl.innerHTML += `
                    <li class="page-item ${currentPage === 0 ? 'disabled' : ''}">
                        <button class="page-item page-link" onclick="loadBooks(${currentPage - 1})">Back</button>
                    </li>
                `;

                // Vòng lặp vẽ các nút số trang 1, 2, 3...
                for (let i = 0; i < totalPages; i++) {
                    paginationUl.innerHTML += `
                        <li class="page-item ${i === currentPage ? 'active' : ''}">
                            <button class="page-link" onclick="loadBooks(${i})">${i + 1}</button>
                        </li>
                    `;
                }

                // Nút "Sau" (Next)
                paginationUl.innerHTML += `
                    <li class="page-item ${currentPage === totalPages - 1 ? 'disabled' : ''}">
                        <button class="page-item page-link" onclick="loadBooks(${currentPage + 1})">Next</button>
                    </li>
                `;
            })
            .catch(error => {
                console.error("Load books failed:", error);
                document.getElementById("bookTableBody").innerHTML =
                "<tr><td colspan='4' class='text-danger p-4'>Không tải được dữ liệu từ API.</td></tr>";
                document.getElementById("paginationInfo").innerText = "Lỗi tải dữ liệu";
                document.getElementById("paginationButtons").innerHTML = "";
            });
    }

    // Các hàm Thêm/Sửa/Xóa giữ nguyên logic nhưng cập nhật gọi loadBooks(currentPage) để giữ đúng trang hiện tại
    document.getElementById("bookForm").addEventListener("submit", function(e) {
        e.preventDefault();
        const bookId = document.getElementById("bookId").value;
        const bookData = {
            id: parseInt(bookId),
            title: document.getElementById("bookTitle").value,
            author: document.getElementById("bookAuthor").value,
            point: document.getElementById("point").value ? parseInt(document.getElementById("point").value) : null,
            bookcomment: document.getElementById("bookcomment").value
        };

        if (isEditMode) {
            fetch(`${API_URL}/${bookId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(bookData)
            })
            .then(response => {
                if (response.ok) {
                    alert("Cập nhật thông tin sách thành công!");
                    myModal.hide();
                    loadBooks(currentPage); // Giữ nguyên trang đang sửa
                }
            });
        } else {
            fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(bookData)
            })
            .then(async response => {
                if (response.status === 201) {
                    alert("Thêm sách mới thành công!");
                    myModal.hide();
                    loadBooks(0); // Thêm mới xong quay về trang 1 để xem sách mới
                } else {
                    const err = await response.json();
                    alert("Lỗi: " + (err.message || "Không thể thêm sách!"));
                }
            });
        }
    });

    function deleteBook(id) {
        if (confirm(`Bạn có chắc chắn muốn xóa cuốn sách có ID: ${id}?`)) {
            fetch(`${API_URL}/${id}`, { method: 'DELETE' })
            .then(response => {
                if (response.ok) {
                    alert("Xóa cuốn sách thành công!");
                    loadBooks(currentPage); // Tải lại trang hiện tại
                }
            });
        }
    }

    function prepareAdd() { isEditMode = false; resetForm(); myModal.show(); }
    function prepareEdit(id, title, author,point,bookcomment) {
        isEditMode = true;
        document.getElementById("formTitle").innerText = "Chỉnh sửa thông tin - ID: " + id;
        document.getElementById("bookId").value = id;
        document.getElementById("bookId").disabled = true;
        document.getElementById("bookTitle").value = title;
        document.getElementById("bookAuthor").value = author;
        document.getElementById("point").value = point || "";
        document.getElementById("bookcomment").value = bookcomment || "";
        document.getElementById("btnSubmit").className = "btn btn-warning";
        document.getElementById("btnSubmit").innerText = "Lưu";
        myModal.show();
    }
    function resetForm() {
        document.getElementById("formTitle").innerText = "Thêm mới thông tin sách";
        document.getElementById("bookForm").reset();
        document.getElementById("bookId").disabled = false;
        document.getElementById("btnSubmit").className = "btn btn-success";
        document.getElementById("btnSubmit").innerText = "Lưu";
    }
</script>
</body>
</html>
